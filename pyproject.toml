[project]
name = "LiteAgentHarness"
version = "0.1.0"
description = ""
requires-python = ">=3.13"
dependencies = [
    "openai>=3.15.0",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
tui = [
    "textual>=8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

